<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>キュルキュルファイターズ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
  background: #f7f7fb;
  color: #222;
}

header {
  padding: 70px 20px;
  text-align: center;
  background: linear-gradient(135deg, #7c4dff, #00bcd4);
  color: white;
}

header h1 {
  font-size: 42px;
  margin: 0 0 10px;
}

header p {
  font-size: 18px;
  margin: 0;
}

nav {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 15px;
  background: white;
  position: sticky;
  top: 0;
}

nav a {
  text-decoration: none;
  color: #333;
  font-weight: bold;
  padding: 8px 12px;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 30px 20px;
}

section {
  background: white;
  margin-bottom: 25px;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.06);
}

h2 {
  margin-top: 0;
}

.card {
  padding: 18px;
  border-radius: 15px;
  background: #f1f1f7;
  margin-top: 12px;
}

.links a {
  display: block;
  padding: 14px;
  margin-top: 10px;
  border-radius: 12px;
  background: #eee;
  color: #222;
  text-decoration: none;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 30px;
  color: #777;
}
</style>
</head>

<body>

<header>
  <h1>キュルキュルファイターズ</h1>
  <p>きゅるふぁい公式サイト</p>
</header>

<nav>
  <a href="#about">ABOUT</a>
  <a href="#news">NEWS</a>
  <a href="#members">MEMBERS</a>
  <a href="#sns">SNS</a>
</nav>

<main>

<section id="about">
  <h2>きゅるふぁいとは？</h2>
  <p>
    キュルキュルファイターズ、通称「きゅるふぁい」。
    ここでは、きゅるふぁいの活動や最新情報を発信しています。
  </p>
</section>

<section id="news">
  <h2>NEWS</h2>
  <div class="card">
    <strong>2026.08.21</strong><br>
    きゅるふぁい公式サイト制作開始！
  </div>
</section>

<section id="members">
  <h2>MEMBERS</h2>
  <div class="card">
    👤 メンバー紹介
    <br><br>
    ※ メンバー情報は順次追加予定！
  </div>
</section>

<section id="sns">
  <h2>SNS</h2>

  <div class="links">
    <a href="#">💬 公式LINE</a>
    <a href="#">🎵 TikTok</a>
    <a href="#">▶️ YouTube</a>
  </div>
</section>

</main>

<footer>
  © 2026 キュルキュルファイターズ
</footer>

</body>
</html>
